name: Demo site (GitHub Pages)

# Publishes docs/ (the built demo: index.html, share card, .nojekyll) to
# https://dolladollabills0117.github.io/Sippy-Brew/ on every push to main.
# Works when Settings → Pages → Source is "GitHub Actions". If Source is
# "Deploy from a branch" (main, /docs or / root), GitHub serves the same files
# from the repo directly, so the site works either way.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
