name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Business-rule tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Web build
        run: pnpm build:web
      - name: Schema and database rules
        run: bash scripts/check-schema.sh
