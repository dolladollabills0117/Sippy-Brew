name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Business-rule tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Web build
        run: pnpm build:web
      - name: Demo build (and check the published copy in docs/ is up to date)
        run: |
          pnpm demo:build
          git diff --exit-code -- docs demo/dist index.html sippy-brew-card.png .nojekyll || (echo "Run pnpm demo:build and commit docs/ and demo/dist/" && exit 1)
      - name: Schema and database rules
        run: bash scripts/check-schema.sh
