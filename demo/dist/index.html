/* Sippy Brew demo: brand tokens from packages/core/src/brand.ts. Single brand look (light). */
:root {
  --espresso: #3B2A1E; --pecan: #6B4F3A; --burnt: #A8642F; --burnt-ink: #8E5226; --caramel: #C68E4E;
  --honey: #E0A847; --latte: #D9C4A3; --vanilla: #F3E5C7; --cream: #FBF6EC; --sky: #87CEEB;
  --danger: #9B2C2C; --success: #2F6B3A;
  --head: "Caprasimo", Georgia, "Times New Roman", serif;
  --body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow: 0 6px 24px -8px rgba(59,42,30,.18), 0 2px 6px rgba(59,42,30,.06);
  --ring: 0 0 0 3px var(--sky), 0 0 0 5px var(--espresso);
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--body); color: var(--espresso); font-size: 16px; line-height: 1.45;
  background-color: var(--vanilla); background-image: var(--beans); background-size: 180px 180px;
  -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: 10px; }
h1, h2, h3 { font-family: var(--head); font-weight: 400; margin: 0; line-height: 1.1; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--pecan); }
.small { font-size: .875rem; }
.num { font-variant-numeric: tabular-nums; }

.wrap {
  max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 112px;
}
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 10px; background: rgba(243,229,199,.82); backdrop-filter: blur(6px);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--vanilla); }
.logo { width: 44px; height: 44px; display: inline-block; border: 0; background: none; padding: 0; }
button.logo { cursor: pointer; border-radius: 12px; transition: transform .15s ease; }
button.logo:active { transform: scale(.94); }
.logo svg { width: 100%; height: 100%; display: block; }

.card { background: var(--cream); border-radius: 22px; box-shadow: var(--shadow); padding: 20px; }
.row { display: flex; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }

.pill { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 22px; border-radius: 999px; border: 0; font-weight: 800; text-decoration: none; white-space: nowrap; }
.pill.dark { background: var(--espresso); color: var(--cream); font-weight: 700; }
.pill.honey { background: var(--honey); color: var(--espresso); min-height: 54px; padding: 0 34px; font-size: 1.1875rem; box-shadow: var(--shadow); }
.pill.honey:active, .pill.honey:hover { background: var(--caramel); }
.btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 52px; border-radius: 14px; border: 0; background: var(--burnt); color: var(--cream); font-weight: 800; font-size: 1.1875rem; padding: 8px 16px; text-align: center; }
.btn:hover, .btn:active { background: var(--caramel); color: var(--espresso); }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn.ghost { background: transparent; color: var(--burnt-ink); font-size: 1rem; min-height: 44px; }
.btn.line { background: var(--cream); color: var(--espresso); border: 2px solid var(--pecan); font-size: 1.05rem; }
.btn.small { min-height: 44px; font-size: .95rem; background: var(--burnt-ink); }
.btn.danger { background: var(--cream); color: var(--danger); border: 2px solid var(--danger); font-size: 1rem; min-height: 44px; }

.sticker { display: inline-block; background: var(--sky); color: var(--espresso); font-weight: 700; padding: 6px 16px; border-radius: 999px; }
.badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: .75rem; font-weight: 800; background: var(--latte); color: var(--espresso); white-space: nowrap; }
.badge.sky { background: var(--sky); }
.badge.honey { background: var(--honey); }
.badge.ok { background: var(--success); color: var(--cream); }
.badge.bad { background: var(--danger); color: var(--cream); }

.hero { padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; }
.hero h1 { font-size: 2.25rem; }
.hero h1 em { font-style: normal; color: var(--burnt); }
.hero .cta { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 6px; }
.hero-beans { width: 84px; flex-shrink: 0; }
.hero-beans .drop { animation: drop .8s ease-out both; animation-delay: var(--d); }
.hero-beans .dance { transform-box: fill-box; transform-origin: center; animation: dance .9s ease-in-out 1s 3; }
@keyframes drop { from { transform: translateY(-60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes dance { 0%,100% { transform: rotate(0) translateY(0); } 25% { transform: rotate(-12deg) translateY(-6px); } 50% { transform: rotate(8deg); } 75% { transform: rotate(-6deg) translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { .hero-beans .drop, .hero-beans .dance { animation: none; } }

.section-title { font-size: 1.75rem; padding: 0 4px; }
.tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tier { display: flex; flex-direction: column; align-items: flex-start; text-align: left; background: var(--cream); border: 2px solid transparent; border-radius: 22px; padding: 16px 12px; min-width: 0; }
.tier.popular { border-color: var(--honey); }
.tier.selected { border-color: var(--espresso); box-shadow: var(--ring); }
.tier .name { font-size: .875rem; color: var(--pecan); line-height: 1.2; }
.tier .price { font-family: var(--head); font-size: 1.75rem; line-height: 1; margin-top: 6px; }
.tier .meta { font-size: .8125rem; color: var(--pecan); }
.tier .badge { font-size: .6875rem; padding: 2px 8px; margin-bottom: 8px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.steps li { display: flex; align-items: center; gap: 12px; background: var(--cream); border-radius: 18px; padding: 14px 16px; font-size: 1.05rem; }
.dot { width: 32px; height: 32px; border-radius: 999px; background: var(--sky); display: grid; place-items: center; font-weight: 800; font-size: .875rem; flex-shrink: 0; }

label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
.input { min-height: 52px; border-radius: 12px; border: 2px solid rgba(107,79,58,.7); background: var(--cream); padding: 10px 14px; font-size: 1rem; width: 100%; }
.input:focus { border-color: var(--espresso); }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: rgba(251,246,236,.97); border-top: 1px solid var(--latte);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs .inner { max-width: 560px; margin: 0 auto; display: flex; justify-content: space-around; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 4px 0; font-size: .78rem; font-weight: 800; min-height: 54px; }
.tab .ico { width: 56px; height: 32px; border-radius: 999px; display: grid; place-items: center; }
.tab[aria-current="page"] .ico { background: var(--sky); }
.tab svg { width: 22px; height: 22px; stroke: var(--espresso); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.switch { display: inline-flex; background: var(--cream); border: 2px solid var(--latte); border-radius: 999px; padding: 3px; }
.switch button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: .82rem; min-height: 36px; }
.switch button[aria-pressed="true"] { background: var(--espresso); color: var(--cream); }

.shop-card { display: flex; gap: 14px; text-align: left; width: 100%; border: 0; }
.thumb { width: 72px; height: 72px; border-radius: 16px; flex-shrink: 0; background: linear-gradient(160deg, var(--burnt), var(--caramel) 35%, var(--cream)); display: grid; place-items: center; }
.menu-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--latte); }
.menu-item:last-child { border-bottom: 0; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { width: 44px; height: 44px; border-radius: 999px; border: 2px solid var(--pecan); background: var(--cream); font-size: 1.3rem; font-weight: 800; line-height: 1; }
.stepper button[disabled] { opacity: .35; }
.stepper output { min-width: 18px; text-align: center; font-weight: 800; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.chip { flex-shrink: 0; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid var(--latte); background: var(--cream); font-weight: 700; }
.chip[aria-pressed="true"] { border-color: var(--espresso); background: var(--sky); }
.lines { display: flex; flex-direction: column; gap: 6px; }
.lines .row { justify-content: space-between; }
.total { border-top: 1px solid var(--latte); padding-top: 8px; font-weight: 800; }
.total .num { font-size: 1.5rem; }
.confirm { border: 2px solid var(--espresso); background: var(--vanilla); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.confirm label { display: flex; gap: 12px; align-items: flex-start; font-weight: 700; min-height: 44px; cursor: pointer; }
.confirm input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--burnt); flex-shrink: 0; }
.alert { border-radius: 14px; border: 2px solid var(--danger); background: var(--cream); color: var(--danger); font-weight: 700; padding: 12px 14px; }
.alert.ok { border-color: var(--success); color: var(--success); }
.meter { height: 12px; border-radius: 999px; background: var(--latte); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--burnt); border-radius: 999px; }

.qr-screen { background: #fff; border-radius: 26px; padding: 22px 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; box-shadow: var(--shadow); }
.qr-box { width: min(100%, 340px); aspect-ratio: 1; max-width: 100%; }
.qr-box svg { width: 100%; height: 100%; display: block; }
.code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 2.1rem; font-weight: 800; letter-spacing: .28em; }
.demo-note { font-size: .8rem; color: var(--pecan); text-align: center; padding: 0 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--espresso); color: var(--cream); padding: 10px 18px; border-radius: 999px; font-weight: 700; max-width: calc(100% - 32px); text-align: center; }
.sheet-back { position: fixed; inset: 0; z-index: 50; background: rgba(59,42,30,.4); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--cream); width: 100%; max-width: 560px; border-radius: 26px 26px 0 0; padding: 22px max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--cream); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 1.75rem; font-variant-numeric: tabular-nums; }
.linkbtn { border: 0; background: none; padding: 6px 2px; min-height: 44px; font-weight: 800; color: var(--burnt-ink); text-decoration: underline; text-underline-offset: 4px; }
.back { border: 0; background: none; font-weight: 800; color: var(--burnt-ink); padding: 8px 0; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }

.subswitch { display: flex; background: var(--cream); border: 2px solid var(--latte); border-radius: 999px; padding: 4px; }
.subswitch button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 54px; border: 0; background: transparent; border-radius: 999px; line-height: 1.15; }
.subswitch button b { font-weight: 800; font-size: .95rem; }
.subswitch button span { font-size: .75rem; color: var(--pecan); font-weight: 600; }
.subswitch button[aria-checked="true"] { background: var(--espresso); color: var(--cream); }
.subswitch button[aria-checked="true"] span { color: rgba(251,246,236,.85); }

.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 50px; padding: 0 14px; border-radius: 14px; border: 2px solid var(--latte); background: var(--cream); text-align: left; width: 100%; }
.opt.on { border-color: var(--espresso); background: var(--vanilla); font-weight: 800; }

/* Plan picker labels */
.step-label { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; padding: 0 4px; margin-top: 2px; }
.step-label .dot { width: 26px; height: 26px; font-size: .8rem; }
.quiz-cta { display: flex; align-items: center; gap: 12px; width: 100%; border: 2px solid var(--honey); text-align: left; padding: 14px 16px; }
.quiz-cta .pill { min-height: 38px; padding: 0 14px; font-size: .85rem; }
.quiz-cta-emoji { font-size: 1.8rem; }

/* Quiz: one card per question; answering swipes it away */
.quiz-stage { position: relative; overflow: hidden; padding: 6px 2px 10px; margin: 0 -2px; }
.quiz-card { display: flex; flex-direction: column; gap: 18px; padding: 24px 20px; min-height: 380px; }
.quiz-q { font-size: 2rem; }
.quiz-dots { display: inline-flex; gap: 6px; }
.quiz-dots i { width: 22px; height: 6px; border-radius: 99px; background: var(--latte); }
.quiz-dots i.on { background: var(--burnt); }
.quiz-answer { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; min-height: 64px; padding: 12px 16px; border-radius: 18px; border: 2px solid var(--latte); background: var(--vanilla); text-align: left; font-size: 1.1rem; transition: transform .12s ease, border-color .12s ease; }
.quiz-answer:active { transform: scale(.98); }
.quiz-answer.on { border-color: var(--espresso); background: var(--sky); }
.quiz-out { animation: swipeOut .28s ease-in forwards; }
.quiz-in { animation: swipeIn .32s ease-out both; }
@keyframes swipeOut { to { transform: translateX(-115%) rotate(-7deg); opacity: 0; } }
@keyframes swipeIn { from { transform: translateX(60%) rotate(4deg); opacity: 0; } to { transform: none; opacity: 1; } }

/* Quiz result */
.result-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 28px 20px; }
.result-emoji { font-size: 4.25rem; line-height: 1; animation: pop .6s cubic-bezier(.2,1.6,.4,1) .15s both; }
.result-h { font-size: 2.6rem; color: var(--burnt); }
.result-line { font-size: 1.15rem; font-weight: 700; max-width: 30ch; }
.result-plan { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; background: var(--vanilla); border-radius: 18px; padding: 16px; }
.result-name { font-family: var(--head); font-weight: 400; font-size: 1.5rem; }
.result-price { font-family: var(--head); font-weight: 400; font-size: 2rem; }
@keyframes pop { from { transform: scale(.3) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }

/* Local shops map */
.map { width: 100%; height: auto; display: block; border-radius: 18px; }
.range { width: 100%; accent-color: var(--burnt); min-height: 32px; }
.shop-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 0; border: 0; border-bottom: 1px solid var(--latte); background: none; text-align: left; }
.shop-row:last-child { border-bottom: 0; }
.map-num { width: 26px; height: 26px; border-radius: 99px; background: var(--burnt); color: var(--cream); display: grid; place-items: center; font-weight: 800; font-size: .8rem; flex-shrink: 0; }
.map-num.far { background: none; border: 2px dashed var(--pecan); }
.loc-card { align-items: center; text-align: center; padding: 26px 20px; }
.loc-emoji { font-size: 3rem; line-height: 1; }
.sticky-cta { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 15; }
.sticky-cta .btn { box-shadow: var(--shadow); }
.terms p { line-height: 1.55; }

@media (prefers-reduced-motion: reduce) { .quiz-out, .quiz-in, .result-emoji { animation: none; } }

/* Neighborhood Passport + invite */
.stamps { display: flex; gap: 8px; flex-wrap: wrap; }
.stamp { width: 42px; height: 42px; border-radius: 999px; border: 2px dashed var(--pecan); display: grid; place-items: center; font-weight: 800; color: var(--pecan); }
.stamp.on { border: 2px solid var(--burnt); background: var(--burnt); color: var(--cream); font-size: 1.15rem; }
.tour { background: var(--vanilla); border-radius: 12px; padding: 10px 12px; font-size: .9rem; }
.refcode { background: var(--vanilla); border-radius: 10px; padding: 8px 12px; font-weight: 800; letter-spacing: .08em; font-size: 1rem; }

/* FAQ: tap a question to reveal the answer */
.faq-cta { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; text-align: left; }
.faq-list { padding: 4px 16px; }
.faq { border-bottom: 1px solid var(--latte); }
.faq:last-child { border-bottom: 0; }
.faq summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 56px; padding: 10px 0; font-weight: 800; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font-size: 1.4rem; font-weight: 800; color: var(--burnt-ink); flex-shrink: 0; transition: transform .2s ease; }
.faq[open] summary::after { transform: rotate(45deg); }
.faq p { padding: 0 0 14px; line-height: 1.55; color: var(--espresso); }
.bonus-opt { display: flex; gap: 12px; align-items: flex-start; border: 2px solid var(--honey); background: var(--cream); border-radius: 16px; padding: 12px 14px; min-height: 44px; cursor: pointer; }
.bonus-opt input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--burnt); flex-shrink: 0; }

/* Merchant tools */
.allergy-card { border: 4px solid var(--danger); }
.allergy-notice { background: var(--danger); color: var(--cream); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.allergy-notice b { font-size: 1.25rem; letter-spacing: .04em; }
.allergy-notice span { font-size: 1.15rem; font-weight: 800; }
.order-note { background: var(--vanilla); border-radius: 12px; padding: 8px 12px; }
.tip-card { background: var(--cream); border-radius: 16px; padding: 12px 14px; font-size: .92rem; }
.notice-card { border: 2px solid var(--honey); }
.photo-card { border: 2px solid var(--honey); }
.scan-row { display: flex; flex-direction: column; gap: 6px; background: var(--vanilla); border-radius: 14px; padding: 10px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
.removed-card { border: 2px solid var(--danger); }

/* Cart */
.cart-btn { position: relative; border: 0; background: none; padding: 0; width: 48px; height: 48px; display: grid; place-items: center; color: var(--burnt); }
.cart-btn .cart-ico { width: 32px; height: 32px; }
.cart-btn:active { transform: scale(.94); }
.cart-ico { width: 22px; height: 22px; display: block; }
.cart-empty-ico { color: var(--burnt); }
.cart-empty-ico .cart-ico { width: 48px; height: 48px; }
.cart-count { position: absolute; top: 2px; right: 0; min-width: 22px; height: 22px; border-radius: 999px; background: var(--burnt); color: var(--cream); font-size: .75rem; font-weight: 800; display: grid; place-items: center; padding: 0 5px; }
.cart-bar .btn { justify-content: space-between; padding: 8px 20px; }
.tabs ~ .sticky-cta, .cart-bar { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }

/* Shop queue: "Start at" breathes as the start time gets close, stronger when it's time. */
.start-at { display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; font-weight: 800; color: var(--burnt-ink); }
.start-at.soon { background: var(--honey); color: var(--espresso); animation: breathe 2.8s ease-in-out infinite; }
.start-at.now, .start-at.late { background: var(--honey); color: var(--espresso); font-size: 1.1rem; animation: breathe-strong 1.6s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { box-shadow: 0 0 0 0 rgba(224,168,71,.15); filter: brightness(1); } 50% { box-shadow: 0 0 14px 6px rgba(224,168,71,.65); filter: brightness(1.12); } }
@keyframes breathe-strong { 0%, 100% { box-shadow: 0 0 0 0 rgba(168,100,47,.25); transform: scale(1); } 50% { box-shadow: 0 0 22px 9px rgba(224,168,71,.9); transform: scale(1.06); } }
@media (prefers-reduced-motion: reduce) { .start-at.soon, .start-at.now, .start-at.late { animation: none; box-shadow: 0 0 0 3px var(--espresso); } }

/* Checkout summary + consent */
.summary-box { border: 2px solid var(--espresso); background: var(--vanilla); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.summary-box ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: .9rem; }
.agree { display: flex; gap: 12px; align-items: flex-start; font-weight: 700; min-height: 44px; cursor: pointer; }
.agree input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--burnt); flex-shrink: 0; }
.email-preview summary { cursor: pointer; display: flex; flex-direction: column; gap: 2px; list-style: none; }
.email-preview pre { white-space: pre-wrap; font-family: var(--body); font-size: .85rem; margin: 8px 0 0; }

</style>

`)}}var dr=t=>`$${(t/100).toFixed(t%100?2:0)}`,pr=v.find(t=>t.id==="decaf"),fr=v.find(t=>t.id==="double_shot"),mr=[{title:"The basics",items:[{q:"What is Sippy Brew?",a:"A monthly coffee pass you can use at participating local coffee shops. You set your coffee budget once, order ahead in the app, and pick up at the counter. We're a membership and ordering service, not a coffee shop."},{q:"How does a Daily Pass work?",a:`Each pass covers one order on one day, at one shop, up to your plan's daily amount: ${dr(pr.maxPassValueCents)} on ${pr.name}, ${dr(fr.maxPassValueCents)} on ${fr.name}. You can use one pass per day.`},{q:"What if my order costs more than my pass covers?",a:"The app shows you the exact difference (the overage) before you place the order, and you have to confirm it. It's charged to your card when the shop hands over your order, at the shop's menu prices, and it goes to the shop. If you have a bonus pass, you can choose to put it toward the overage: it covers up to your daily amount and you pay only what's left."},{q:"Do unused passes roll over?",a:`No. Monthly passes reset on your renewal date and unused ones expire. Bonus passes from the Neighborhood Passport and referrals are the exception: each lasts ${c.bonusPassLifetimeDays} days from the day you earn it.`},{q:"Is this a discount?",a:"No. Sippy Brew is a way to budget the coffee you already buy and to discover local shops. How much value you get depends on how many passes you use and what you order. We don't promise savings."},{q:"Can I order food?",a:"No. Sippy Brew is drinks only, so passes never cover food. You can always buy food from the shop directly. If a shop offers you food through Sippy Brew, let us know."}]},{title:"Your orders",items:[{q:"Who makes my coffee?",a:"The coffee shop. Participating shops are independent businesses, not owned or run by Sippy Brew. Each shop is responsible for its drinks, ingredients, prices, service, staff and premises."},{q:"Something went wrong with my order. Who do I contact?",a:"Contact the coffee shop that made it. They're the only ones who can remake a drink, fix a mistake or sort out a wait. Your order screen shows the shop's name and address. Sippy Brew isn't responsible for the quality of a drink, mistakes in an order, orders that weren't made or received, or wait times."},{q:"I have an allergy or dietary need. Is my drink safe?",a:"Add it in the Allergies box when you order, so the shop sees an allergy notice with your order, and tell the barista at pickup too, every time, before you drink anything. Menus, ingredients and allergen information come from the shops and can change. Sippy Brew doesn't prepare food or drinks and can't check ingredients or guarantee that a drink is free of any allergen."},{q:"What if I can't make it or the shop cancels?",a:"Contact the shop as soon as you can. Only the shop can cancel an order, and only before it marks the order as being prepared. If it does, your pass is returned, as long as it's still the same month (or, for a bonus pass, before it expires). Once the shop has started making it, it can't be cancelled, and if you don't pick it up it counts as not picked up."},{q:"What happens if I don't pick up my order?",a:`If you don't pick up your order, the shop can mark it as not picked up starting ${c.noShowGraceMinutes} minutes after your pickup time. It isn't refunded: the pass stays used, any overage you confirmed is charged, and the shop is paid for the drink it made. We'll send you a reminder when that happens.`},{q:"Can shops change their prices?",a:`Yes. Prices are set by each shop and can change at any time. Shops must update their Sippy Brew menu when their prices change; that's how you're told. The app always shows the shop's current price before you order, and recently changed items are marked "price updated".`},{q:"Can I still earn the shop's own rewards points?",a:"Usually, yes. Give the shop your loyalty number or card at pickup like you normally would. Those programs belong to the shops and follow their rules."}]},{title:"Billing",items:[{q:"Can I change my pass?",a:"Any time. A change takes effect at the start of your next month; this month stays as it is. Moving up from House to Specialty mid-month is the one exception: you pay the monthly difference and it applies right away."},{q:"Can I cancel?",a:"Yes, any time from your account. Your pass keeps working until the end of the month you've paid for, and then it stops renewing."},{q:"Do you give refunds?",a:"Monthly payments aren't refunded for unused passes or partial months, except where the law requires it. If you think you were charged by mistake, contact us and we'll look into it."},{q:"Is my card information safe?",a:"Payments are handled by Stripe. Your card number is entered on Stripe's secure page; Sippy Brew never sees or stores it."},{q:"Can prices or plans change?",a:"Yes. If we change the price of your plan, we'll tell you before it applies, and you can change or cancel before then."}]},{title:"Rewards",items:[{q:"How does the Neighborhood Passport work?",a:`Pick up orders at ${c.passportShopsForFreePass} different participating shops and you earn a free day pass. A visit counts when the shop scans your pickup code.`},{q:"What's the Grand Tour?",a:`Visit every participating shop and earn ${c.grandTourFreeMonths} months of your plan free. It switches on once more than ${c.grandTourMinShops-1} shops have joined. Shops count once they've been live for ${c.grandTourShopMinLiveDays} days.`},{q:"How do referrals work?",a:`Share your link. When ${c.referralFriendsNeeded} friends join with it and pay for their first month, you get ${c.referralBonusPasses} bonus passes. You can't refer yourself.`},{q:"Anything else I should know about rewards?",a:"Bonus passes and free months have no cash value and can't be sold, transferred or exchanged for money. Bonus passes need an active pass to use. We can change or end rewards programs, and we can remove rewards earned through fraud or abuse."}]},{title:"Privacy",items:[{q:"How do you use my location?",a:`Only to show participating shops near you, and only if you allow it. You can turn it off any time in your phone or browser settings. Searches stay within ${c.maxRadiusMiles} miles to keep it local.`}]}],hr=`This FAQ is a summary. If anything here differs from our Terms of Service, the Terms apply. Still have a question? Email ${O.supportEmail}.`,gr=[{title:"Orders",items:[{q:"When should I make a Sippy Brew order?",a:`Close to the pickup time. Each order shows "Start at" ${c.prepLeadMinutes} minutes before pickup. Making drinks then keeps them fresh and means fewer drinks wasted if a member doesn't show.`},{q:"What if a member doesn't pick up their order?",a:`Mark it "Not picked up" starting ${c.noShowGraceMinutes} minutes after the pickup time. The member gets a reminder and Sippy Brew is notified. No-shows aren't refunded: you're paid for the pass just like a pickup, and any overage the member confirmed is charged to them and paid to you.`},{q:"What's the red ALLERGY NOTICE?",a:"The member listed an allergy with their order. Read it before you mark the order as preparing, follow your shop's allergen procedures, and talk to the member at pickup if you have any doubt. If you can't make the order safely, cancel it before you start preparing it, so the member's pass is returned. Your shop is responsible for its ingredients and allergen handling."},{q:"How do I hand off an order?",a:"Scan the member's QR code (or type their 6-character code) at pickup. Codes refresh every 30 seconds and work once, so a screenshot won't work."},{q:"Can I cancel an order?",a:"Yes, but only before you mark it as being prepared, for example if you're out of something or can't make it safely. The member's pass is returned. Once you've marked it preparing it can't be cancelled, so check the order (and any allergy notice) before you start. A no-show can't be cancelled."}]},{title:"Menu and prices",items:[{q:"Can I change my prices?",a:`Yes, any time. When your prices change you must update your Sippy Brew menu right away: that's how members are told. Members always see your current Sippy Brew menu price before they order, and changed items are marked "price updated". Orders already placed keep the price they were placed at.`},{q:"What's the fastest way to add my menu?",a:"Take a photo of your menu board or printed menu. We read the coffee items and prices for you and fill them in; check each one, fix anything that's off, and save. Nothing is added until you confirm it. Food is skipped automatically, since only coffee can be sold through Sippy Brew."},{q:"Can I sell food?",a:"No. Sippy Brew is drinks only: no food, whatsoever. Members can still buy food from you directly, outside Sippy Brew."},{q:"What happens if my shop sells food through Sippy Brew?",a:"Your shop is removed from the platform, with no exceptions. If it happened by genuine error rather than misrepresentation (for example, a topping named so it read like a food item), you can appeal once from your shop dashboard and we'll review it."},{q:"How do I list fruit toppings or flavors like cookie?",a:`Name them for what they are, as part of the drink: "Cookie syrup", "Dragonfruit topping", "Strawberry puree", "Almond milk". A drink name works too, like "Dragonfruit Refresher". Anything that reads like food on its own, like "Apples" or "Cookie", can't be saved.`},{q:"Can I offer customizations like oat milk or an extra shot?",a:"Yes. Add them to any drink in your menu with your prices. If they push an order over the member's pass, the member confirms and pays the difference, and it goes to you."}]},{title:"Getting paid",items:[{q:"How much do I get paid?",a:`You keep ${100-c.commissionBps/100}% of what each pass covers, including no-shows and bonus passes, plus 100% of overages less card processing. Payouts go to your bank every Monday through Stripe.`},{q:"Do I pay for card processing?",a:"Only on overages, which are charged on your behalf. Sippy Brew covers processing on members' monthly payments."}]},{title:"Your shop",items:[{q:"Who is responsible for the drinks and service?",a:"Your shop is. You're an independent business: you make, price and serve your drinks, and you're responsible for ingredients, allergens, food safety, your staff and your premises. Sippy Brew runs the membership, sends you orders and pays you."},{q:"Can members still earn my loyalty points?",a:"Yes. If you have a rewards program, let members give their number or card at pickup like any other customer."},{q:"How do I pause orders?",a:`Turn off "Accepting orders" on your Orders screen. Members can still see your shop but can't order until you turn it back on.`}]}],yr=`This FAQ is a summary. If anything here differs from your Sippy Brew merchant agreement, the agreement applies. Still have a question? Email ${O.supportEmail}.`;var nt=`<svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sippy Brew">

<script>/* Sippy Brew tappable demo. Business rules come from the real @sippy/core bundle (window.SippyCore). */
(function () {

  var BASE_SHOPS = [
    { id: "main", name: "Main Street Roasters", address: "25 Main St, West Orange", lat: 40.7962, lng: -74.2360, hours: "6:30am–6pm",
      story: "Small-batch roasting in the back room every Tuesday. Every shot pulled like it's the first.",
      menu: [["espresso", "Espresso", "double", 325, "espresso"], ["cortado", "Cortado", "4.5 oz", 425, "espresso"], ["latte", "Latte", "12 oz", 525, "espresso"],
             ["maple", "Maple Cinnamon Latte", "16 oz", 650, "specialty"], ["drip", "House Drip", "12 oz", 275, "brewed"], ["cold", "Cold Brew", "16 oz", 500, "cold"], ["mocha", "Big Mocha", "20 oz", 875, "specialty"]] },
    { id: "eagle", name: "Eagle Rock Espresso", address: "450 Eagle Rock Ave, West Orange", lat: 40.8125, lng: -74.2520, hours: "7am–5pm",
      story: "A bright corner café with a single-origin pour-over of the week. Neighbors, laptops and dogs welcome.",
      menu: [["americano", "Americano", "12 oz", 350, "espresso"], ["capp", "Cappuccino", "8 oz", 450, "espresso"], ["flat", "Flat White", "8 oz", 475, "espresso"],

             ["vdrip", "Drip Coffee", "16 oz", 300, "brewed"], ["viced", "Iced Coffee", "16 oz", 375, "cold"]] },
    { id: "montclair", name: "Common Grounds Montclair", address: "12 Church St, Montclair", lat: 40.8150, lng: -74.2120, hours: "6am–7pm",
      story: "Communal tables, local art on the walls and a cold brew that's steeped for 20 hours.",
      menu: [["mlatte", "Latte", "12 oz", 500, "espresso"], ["mcold", "Cold Brew", "16 oz", 475, "cold"], ["mdrip", "Drip Coffee", "12 oz", 275, "brewed"], ["mhoney", "Honey Lavender Latte", "12 oz", 625, "specialty"]] },
    { id: "southorange", name: "South Orange Social", address: "15 Sloan St, South Orange", lat: 40.7490, lng: -74.2580, hours: "7am–4pm",

  ].map(function (s) {
    s.menu = s.menu.map(function (m) {

  var OTHER_SHOPS = [
    { id: "x-hoboken", name: "Hudson Pier Coffee", address: "120 Washington St, Hoboken", lat: 40.7377, lng: -74.0302 },

  var WEST_ORANGE = { lat: 40.7987, lng: -74.2391, label: "West Orange, NJ", source: "sample" };
  function here() { return state.loc || WEST_ORANGE; }
  /** Approved shops plus other towns' shops, split by the member's radius (rules from core). */
  function localSplit() {
    var list = memberShops().map(function (x) { return x.lat ? x : Object.assign({}, x, { lat: WEST_ORANGE.lat + 0.004, lng: WEST_ORANGE.lng - 0.006 }); }).concat(OTHER_SHOPS);
    var split = S.splitByRadius(list, here(), state.radius || S.RULES.defaultRadiusMiles);
    // Spotlighted shops first, then nearest.
    split.nearby.sort(function (a, b) { return (isSpotlight(b.id) ? 1 : 0) - (isSpotlight(a.id) ? 1 : 0) || a.distanceMiles - b.distanceMiles; });
    return split;
  }

  function allShops() { return BASE_SHOPS.concat(state.customShops || []).map(function (x) { return withExtras(x); }); }
  function withExtras(x) {
    var menu = x.menu.concat((state.extraMenu || {})[x.id] || []).map(function (m) {
      var own = (state.mods || {})[m.id];
      var price = (state.prices || {})[m.id];

    });
    return Object.assign({}, x, { menu: menu });
  }
  function shopById(id) {

    for (var i = 0; i < list.length; i++) if (list[i].id === id) return withExtras(list[i]);
    return withExtras(BASE_SHOPS[0]);
  }
  function isPaused(id) { return !!(state.paused || {})[id]; }

  /** Members only see approved (active) shops; spotlighted shops come first. */
  function memberShops() {
    return allShops().filter(function (x) { return shopStatus(x.id) === "active"; })
      .sort(function (a, b) { return (isSpotlight(b.id) ? 1 : 0) - (isSpotlight(a.id) ? 1 : 0); });
  }
  var ADMIN_PASSWORD = "sippy-admin";
  // Admins can also sign in from the regular "Log in" form with this email and the password above.
  var ADMIN_EMAIL = "admin@sippybrew.com";

  function fresh() {
    return { screen: "landing", selectedTier: S.DEFAULT_TIER, user: null, tierId: null, passesLeft: 0, passDaysUsed: [], dayOffset: 0,
      session: null, tab: "shops", shopTab: "orders", counterShop: "main", detail: null, cart: [], customize: null, picked: [], cqty: 1, mods: {}, editMods: null, confirmedOverage: null, pickupIdx: 0,
      orders: [], tickets: [], soldOut: {}, customShops: [], extraMenu: {}, paused: {}, shopError: null, shopStatus: {}, spotlight: {}, adminTab: "overview", adminError: null, pickSub: S.DEFAULT_SUB_TIER, upgradeConfirm: false,
      error: null, scan: null, sheet: null, authMode: "signup",
      quizStep: 0, quiz: {}, loc: null, locAsked: false, radius: S.RULES.defaultRadiusMiles, showBeyond: false, periodStart: 0, pendingTier: null,
      bonus: [], refCode: null, friends: 0, grandTour: false,
      removed: {}, appeals: {}, agreed: false, lastEmail: null, contactSent: false, cartShop: null, editLine: null, customizeShop: null,
      minuteOffset: 0, prices: {}, priceChangedAt: {}, notices: [], teamAlerts: [], scanRows: null, scanSkipped: [], scanning: false, orderNote: "", orderAllergy: "" };
  }
  var state = fresh();
  try { var saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved && saved.screen) state = Object.assign(fresh(), saved, { sheet: null, scan: null, error: null }); } catch (e) {}
  delete state["view"];
  // Drinks only: drop any saved items or add-ons that break the food rule (from older versions of the demo).
  Object.keys(state.extraMenu || {}).forEach(function (k) {
    state.extraMenu[k] = state.extraMenu[k].filter(function (m) { return !S.foodProblemInMenuItem(m.name); });
  });
  (state.customShops || []).forEach(function (sh) { sh.menu = sh.menu.filter(function (m) { return !S.foodProblemInMenuItem(m.name); }); });
  Object.keys(state.mods || {}).forEach(function (k) {
    state.mods[k] = state.mods[k].map(function (g) { return Object.assign({}, g, { options: g.options.filter(function (o) { return !S.foodProblemInCustomization(o.name); }) }); }).filter(function (g) { return g.options.length; });
  });
  if (state.screen === "app" && state.session !== "member" && state.session !== "shop") state.session = state.user && state.tierId ? "member" : null;
  if (state.screen === "app" && !state.session) state.screen = "landing";
  function save() { try { var c = Object.assign({}, state); delete c.sheet; delete c.scan; delete c.error; localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) {} }

  var toastTimer = null;
  function toast(msg) {

    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 2600);
  }

  // Demo clock: "Start a new day" moves the calendar forward so you can use another pass.

  function money(c) { return S.formatCents(c, { showZeroCents: c % 100 !== 0 }); }

  function esc(s) { return String(s).replace(/[&<>"']/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]; }); }
  function tier() { return state.tierId ? S.getTier(state.tierId) : null; }
  // ---- Rewards (rules from core: passport, Grand Tour, referrals; bonus passes roll over a year)
  function bonusLeft() { return S.bonusBalance(state.bonus || [], now()); }
  function totalPassesLeft() { return state.passesLeft + bonusLeft(); }
  function hasBonus(key) { return (state.bonus || []).some(function (g) { return g.key === key; }); }
  function grantBonus(source, key, passes) {

    var n = now();
    state.bonus.push({ source: source, key: key, passes: passes, used: 0, grantedAt: n.toISOString(), expiresAt: S.bonusExpiry(n).toISOString() });
    return true;
  }
  function liveShopsForPassport() {
    var ago = new Date(now().getTime() - 90 * 864e5).toISOString();
    return memberShops().map(function (x) { return { id: x.id, liveSince: x.custom ? now().toISOString() : ago }; });
  }
  function passport() {
    var visited = state.orders.filter(function (o) { return o.status === "picked_up"; }).map(function (o) { return o.shopId; });
    return S.passportStatus({ visitedShopIds: visited, liveShops: liveShopsForPassport(), passportEarned: hasBonus("passport"), grandTourEarned: !!state.grandTour, now: now() });
  }
  /** After a pickup: maybe complete the passport or the Grand Tour. */
  function awardVisit() {
    var st = passport();
    if (st.passportDue && grantBonus("passport", "passport", S.RULES.passportFreePasses)) {

    }
    if (st.grandTour.due) { state.grandTour = true; setTimeout(function () { toast("🏆 Grand Tour complete! " + S.RULES.grandTourFreeMonths + " months free."); }, 900); }
  }
  function friendJoined() {
    state.friends = (state.friends || 0) + 1;

    var r = S.referralStatus(state.friends, granted);
    for (var i = 0; i < r.rewardsDue; i++) grantBonus("referral", "referral-" + (granted + i + 1), r.passesPerReward);
    return r;
  }
  function bonusLine() {
    var b = bonusLeft(); if (!b) return "";
    var exp = S.bonusExpiresSoonest(state.bonus, now());
    return '<span class="small"><b>+ ' + b + " bonus pass" + (b === 1 ? "" : "es") + "</b> · " + (b === 1 ? "rolls" : "roll") + " over until " + dateFmt.format(exp) + "</span>";

  function latestTicket(orderId) {

  function issueTicket(orderId) {
    var nowMs = Date.now();
    state.tickets.forEach(function (x) { if (x.orderId === orderId && !x.redeemedAt && x.expiresAt > nowMs) x.expiresAt = nowMs; });
    var q = S.issueQr(new Date(nowMs));
    var t = { orderId: orderId, token: q.token, shortCode: q.shortCode, payload: q.payload, issuedAt: nowMs, expiresAt: q.expiresAt.getTime(), redeemedAt: null };
    state.tickets.push(t);
    if (state.tickets.length > 60) state.tickets = state.tickets.slice(-60);
    return t;
  }
  function liveTicket(orderId) {

  function upgradeInfo() {
    var t = tier(); if (!t) return null;
    var to = S.upgradeOffer(t, state.passesLeft); if (!to) return null;
    var since = periodStartDate().getTime() - 864e5;

    var nudge = S.suggestUpgrade({ plan: t, periodOrders: periodOrders, passesLeft: state.passesLeft });
    var over = periodOrders.filter(function (o) { return o.status !== "cancelled" && o.overageCents > 0; });
    return { to: to, suggested: !!nudge, overageOrders: over.length, overagePaid: over.reduce(function (a, o) { return a + o.overageCents; }, 0), nowCents: S.upgradeNowCost(t, to) };

  function menuForOrder(s) {
    return s.menu.map(function (m) { return { id: m.id, shopId: s.id, name: m.name, priceCents: m.priceCents, category: m.category, available: true, soldOutToday: !!state.soldOut[m.id], modifierGroups: m.modifierGroups }; });

  function customizeSheet(s) {
    var m = s.menu.filter(function (x) { return x.id === state.customize; })[0]; if (!m) return "";

    var priced = state.cart.length ? S.priceOrder(state.cart, menuForOrder(s), s.id) : null;

      var p = lines.filter(function (x) { return x.menuItemId === l.menuItemId && x.options.map(function (o) { return o.optionId; }).sort().join(",") === key; })[0];
      var item = s.menu.filter(function (x) { return x.id === l.menuItemId; })[0];
      return '<div class="row between" style="align-items:flex-start;border-bottom:1px solid var(--latte);padding-bottom:8px"><div class="grow"><b>' + l.quantity + "× " + esc(item ? item.name : "Item") + "</b>" +
        (p && p.options.length ? '<div class="muted small">' + esc(S.describeOptions(p.options)) + "</div>" : "") +
        '<div class="row" style="gap:8px;margin-top:6px;flex-wrap:wrap"><div class="stepper"><button data-a="cart-bump" data-id="' + li + '" data-d="-1" aria-label="One fewer">−</button><button data-a="cart-bump" data-id="' + li + '" data-d="1" aria-label="One more" ' + (l.quantity >= S.MAX_QUANTITY_PER_LINE ? "disabled" : "") + ">+</button></div>" +
        (item && item.modifierGroups.length ? '<button class="linkbtn" style="min-height:36px;padding:0 4px" data-a="edit-line" data-id="' + li + '">Edit</button>' : "") +
        '<button class="linkbtn" style="min-height:36px;padding:0 4px;color:var(--danger)" data-a="remove-line" data-id="' + li + '">Remove</button></div></div>' +
        '<b class="num">' + (p ? money2(p.lineTotalCents) : "") + "</b></div>";
    }).join("") + "</div>" : "";
    var base = S.splitPassValue(total, t.maxPassValueCents);
    var spareBonus = S.bonusForOverageAvailable(totalPassesLeft(), bonusLeft());
    var bonusCover = state.useBonus && spareBonus > 0 ? S.bonusOverageCover(base.overageCents, t.maxPassValueCents) : 0;
    // What the member pays after any bonus pass they chose to use.
    var split = { passCoveredCents: base.passCoveredCents + bonusCover, overageCents: base.overageCents - bonusCover };
    var pass = S.checkPassAvailable({ passesLeft: totalPassesLeft(), passDaysUsed: state.passDaysUsed, now: now(), timeZone: TZ });
    var hasOver = split.overageCents > 0;
    var confirmed = !hasOver || state.confirmedOverage === split.overageCents;
    var slots = S.pickupSlots(now(), ALL_DAY, TZ).slice(0, 12);
    var chips = slots.map(function (d, i) { return '<button class="chip" data-a="pickup" data-id="' + i + '" aria-pressed="' + (i === state.pickupIdx) + '">' + timeFmt.format(d) + "</button>"; }).join("");
    var label = hasOver ? "Use pass + pay " + money2(split.overageCents) + " overage" : "Use today's pass";
    if (!state.cart.length) {
      return '<button class="back" data-a="back">‹ Back</button><h1 style="font-size:2rem;padding:0 4px">Your cart</h1>' +
        '<div class="card stack" style="align-items:center;text-align:center"><span class="cart-empty-ico">' + CART + '</span><b>Your cart is empty</b><span class="muted small">Pick a shop and add a coffee.</span>' +
        '<button class="btn" data-a="tab" data-id="shops">Find a shop</button></div>';
    }
    return '<button class="back" data-a="cart-back">‹ ' + esc(s.name) + "</button>" +
      '<h1 style="font-size:2rem;padding:0 4px">Your cart</h1><p class="muted" style="padding:0 4px;margin-top:-12px">From ' + esc(s.name) + "</p>" +
      '<div class="card stack"><h2 style="font-size:1.4rem">Items</h2>' + cartHtml +
      '<button class="btn line" data-a="open-shop" data-id="' + s.id + '">+ Add more from ' + esc(s.name) + "</button>" + (priced && !priced.ok ? '<div class="alert" role="alert">' + esc(priced.message) + "</div>" : "") +
      '<div class="lines"><div class="row"><span class="muted">Pass covers (first ' + money2(t.maxPassValueCents) + ')</span><b class="num">' + money2(base.passCoveredCents) + "</b></div>" +
      (bonusCover ? '<div class="row"><span class="muted">Bonus pass toward the overage</span><b class="num">' + money2(bonusCover) + "</b></div>" : "") +
      '<div class="row"><span class="muted">Overage</span><b class="num">' + money2(split.overageCents) + "</b></div>" +
      '<div class="row total"><span>Order total</span><span class="num">' + money2(total) + "</span></div></div>" +
      (base.overageCents > 0 && spareBonus > 0 ? '<label class="bonus-opt" for="ub"><input id="ub" type="checkbox" data-a="use-bonus" ' + (state.useBonus ? "checked" : "") + '><span><b>Use a bonus pass toward the overage</b><span class="muted small" style="display:block">It covers up to ' + money2(Math.min(base.overageCents, t.maxPassValueCents)) + " of the " + money2(base.overageCents) + " overage. You have " + spareBonus + " bonus pass" + (spareBonus === 1 ? "" : "es") + " to use.</span></span></label>" : "") +
      (hasOver ? '<div class="confirm"><b>This order is ' + money2(split.overageCents) + " over your pass.</b>" +
        '<span class="muted small">' + (S.overageIsCharged(split.overageCents) ? "It's charged to your card on file when the shop hands over your order, at the shop's menu prices. It goes 100% to the shop." : "Overages under " + money2(S.RULES.minOverageChargeCents) + " are waived, so you won't be charged for this one.") + "</span>" +
        '<label for="ov"><input id="ov" type="checkbox" data-a="confirm-overage" data-amount="' + split.overageCents + '" ' + (confirmed ? "checked" : "") + "><span>I confirm the " + money2(split.overageCents) + " overage. My pass covers " + money2(split.passCoveredCents) + " of the " + money2(total) + " total.</span></label>" +
        (upgradeInfo() && S.overageCoveredByUpgrade(t, total) > 0 ? '<span class="small" style="background:var(--cream);border-radius:12px;padding:8px 10px">Tip: on <b>' + S.upgradeTarget(t).name + "</b>, " + money2(S.overageCoveredByUpgrade(t, total)) + ' of this overage would be covered by your pass. <button class="linkbtn" style="min-height:0;padding:0" data-a="goto-upgrade">See upgrade</button></span>' : "") +
        "</div>" : "") +
      '<span class="muted small">' + state.passesLeft + " of " + t.passesPerMonth + " passes left" + (bonusLeft() ? " + " + bonusLeft() + " bonus" : "") + " · one pass per day</span>" +
      '<label class="field" for="o-allergy" style="gap:4px">Allergies<span class="muted small" style="font-weight:400">Any allergies? Tell the shop here so it shows on your order, and remind the barista at pickup.</span>' +
      '<input class="input" id="o-allergy" data-a="order-allergy" maxlength="' + S.RULES.orderNoteMaxChars + '" placeholder="e.g. tree nuts, dairy" value="' + esc(state.orderAllergy || "") + '"></label>' +
      '<label class="field" for="o-note" style="gap:4px">Note for the barista <span class="muted small" style="font-weight:400">(optional)</span>' +
      '<input class="input" id="o-note" data-a="order-note" maxlength="' + S.RULES.orderNoteMaxChars + '" placeholder="e.g. extra hot, light ice" value="' + esc(state.orderNote || "") + '"></label>' +
      '<b>Pickup time</b><div class="chips">' + chips + "</div>" +
      (!pass.ok && total > 0 ? '<div class="alert" role="alert">' + esc(pass.message) + "</div>" : "") +
      (state.error ? '<div class="alert" role="alert">' + esc(state.error) + "</div>" : "") +
      (isPaused(s.id) ? '<div class="alert" role="alert">This shop isn\'t taking orders right now.</div>' : "") +
      '<button class="btn" data-a="place" data-id="' + s.id + '" ' + (total === 0 || !pass.ok || !confirmed || isPaused(s.id) || (priced && !priced.ok) ? "disabled" : "") + ">" + label + "</button></div>";
  }

  function orderById(id) { for (var i = 0; i < state.orders.length; i++) if (state.orders[i].id === id) return state.orders[i]; return null; }
  var OPEN = ["received", "preparing", "ready"];
  var LABEL = S.ORDER_STATUS_LABELS;

  function qrDetail(id) {
    var o = orderById(id); if (!o) return shopsTab();
    var open = OPEN.indexOf(o.status) >= 0;
    var title = o.status === "ready" ? "Ready for pickup!" : o.status === "picked_up" ? "Enjoy!" : o.status === "cancelled" ? "Order cancelled" : o.status === "no_show" ? "Not picked up" : "Show this at the counter";
    var items = o.items.map(function (i) { return "<div>" + i.quantity + "× " + esc(i.name) + ' <span class="muted">(' + i.size + ")</span>" + (i.options && i.options.length ? '<div class="muted small">' + esc(S.describeOptions(i.options)) + "</div>" : "") + "</div>"; }).join("");
    var t = open ? liveTicket(id) : null;
    return '<button class="back" data-a="back">‹ Back</button>' +
      '<div class="qr-screen"><span class="muted small" style="text-transform:uppercase;letter-spacing:.08em;font-weight:800">' + esc(shopById(o.shopId).name) + "</span>" +
      '<h1 style="font-size:1.9rem">' + title + '</h1><span class="badge ' + (o.status === "ready" ? "sky" : o.status === "picked_up" ? "ok" : o.status === "cancelled" ? "bad" : "") + '">' + LABEL[o.status] + "</span>" +
      (open ? '<div class="qr-box" id="qr" role="img" aria-label="Pickup QR code"></div><span class="muted small">Or tell the barista</span><span class="code" id="qr-code">' + t.shortCode + '</span><span class="muted small" id="qr-left" aria-live="polite"></span>' +
        '<p class="muted small">Codes refresh every 30 seconds and work once. On a real phone the screen goes to full brightness.</p>' : "") +
      '<div style="align-self:stretch;text-align:left" class="stack"><span class="muted small">Pickup ' + timeFmt.format(new Date(o.pickupAt)) + "</span>" + items +
      '<div class="lines"><div class="row"><span class="muted">Covered by your Daily Pass</span><span class="num">' + money2(o.passCoveredCents) + "</span></div>" +
      (o.overageCents ? '<div class="row"><span class="muted">Overage you confirmed</span><span class="num">' + money2(o.overageCents) + "</span></div>" : "") +
      '<div class="row total"><span>Order total</span><span class="num">' + money2(o.totalCents) + "</span></div></div></div></div>" +
      (open ? '<button class="btn line" data-a="demo-pickup" data-id="' + o.id + '">Demo: the shop scans it</button><p class="demo-note">Or sign out on the Account tab and tap <b>Shop log in</b> to scan it from the shop side.</p>' : "");
  }

  function ordersTab() {
    var row = function (o) {
      return '<button class="card stack" style="gap:4px;text-align:left;width:100%;border:0' + (o.status === "ready" ? ";box-shadow:0 0 0 3px var(--sky)" : "") + '" data-a="open-order" data-id="' + o.id + '">' +
        '<div class="row between"><b>' + esc(shopById(o.shopId).name) + '</b><span class="badge' + (o.status === "ready" ? " sky" : o.status === "picked_up" ? " ok" : o.status === "cancelled" ? " bad" : "") + '">' + LABEL[o.status] + "</span></div>" +
        '<span class="muted small">' + dateFmt.format(new Date(o.createdAt)) + " · " + o.items.map(function (i) { return i.quantity + "× " + esc(i.name); }).join(", ") + "</span>" +
        '<span class="small">Daily Pass' + (o.overageCents ? " + " + money2(o.overageCents) + " overage" : "") + "</span>" +
        (OPEN.indexOf(o.status) >= 0 ? '<b style="color:var(--burnt-ink)">Show pickup QR →</b>' : "") + "</button>";
    };
    var open = state.orders.filter(function (o) { return OPEN.indexOf(o.status) >= 0; });
    var past = state.orders.filter(function (o) { return OPEN.indexOf(o.status) < 0; });
    return '<h1 style="font-size:2rem;padding:0 4px">Order</h1><button class="btn" data-a="tab" data-id="shops">Find a shop and order</button>' +
      '<h2 class="section-title">Waiting for pickup</h2>' + (open.length ? '<div class="stack">' + open.map(row).join("") + "</div>" : '<div class="card muted">Nothing waiting. Order from any shop and your pickup QR shows up here.</div>') +
      '<h2 class="section-title">History</h2>' + (past.length ? '<div class="stack">' + past.map(row).join("") + "</div>" : '<div class="card muted">No past orders yet.</div>');
  }

  function accountTab() {
    var t = tier();
    return '<h1 style="font-size:2rem;padding:0 4px">Account</h1>' +
      '<div class="card stack" style="gap:6px"><span class="muted small">Signed in as</span><b>' + esc(state.user.name) + '</b><span class="muted small">' + esc(state.user.email) + "</span></div>" +
      '<div class="card stack"><span class="muted small">Plan</span><h2 style="font-size:1.6rem">' + t.name + "</h2>" +
      '<span class="muted">' + money(t.priceCents) + "/month · " + t.passesPerMonth + " passes · " + money2(t.maxPassValueCents) + " max per pass</span>" +
      (state.pendingTier ? '<div class="alert ok" role="status" style="color:var(--espresso);border-color:var(--honey)">Switching to <b>' + S.getTier(state.pendingTier).name + "</b> on " + dateFmt.format(periodEndDate()) + '. <button class="linkbtn" style="min-height:0;padding:0" data-a="keep-plan">Keep my current plan</button></div>' : "") +
      '<span class="muted small">Change your pass any time. Changes start with your next month, on ' + dateFmt.format(periodEndDate()) + ".</span>" +
      '<button class="btn line" data-a="change-plan">Change plan</button></div>' +
      (upgradeInfo() ? upgradeCard(upgradeInfo(), upgradeInfo().suggested) : "") +
      '<div class="card stack"><div class="row between"><span class="muted small">Daily Passes this month</span>' + passStatus() + "</div>" +
      '<b style="font-size:1.75rem" class="num">' + state.passesLeft + ' <span class="muted" style="font-size:1rem;font-weight:400">of ' + t.passesPerMonth + " left</span></b>" +
      '<div class="meter"><span style="width:' + Math.round((100 * state.passesLeft) / t.passesPerMonth) + '%"></span></div>' +
      '<span class="muted small">Unused monthly passes expire at renewal. Bonus passes roll over for a year.</span>' + bonusLine() + "</div>" +
      inviteCard() +
      (state.lastEmail ? '<details class="card email-preview"><summary><b>📧 Your confirmation email</b><span class="muted small">Sent when you joined: your terms and how to cancel</span></summary><p class="muted small"><b>' + esc(state.lastEmail.subject) + "</b></p><pre>" + esc(state.lastEmail.text) + "</pre></details>" : "") +
      '<button class="card faq-cta" data-a="contact"><span aria-hidden="true" style="font-size:1.6rem">✉️</span><span class="grow stack" style="gap:2px;text-align:left"><b>Contact us</b><span class="muted small">' + esc(S.SITE.supportEmail) + '</span></span><span aria-hidden="true" style="font-size:1.4rem">›</span></button>' +
      '<button class="card faq-cta" data-a="faq"><span aria-hidden="true" style="font-size:1.6rem">❓</span><span class="grow stack" style="gap:2px;text-align:left"><b>Questions?</b><span class="muted small">Passes, orders, billing, rewards and who to contact.</span></span><span aria-hidden="true" style="font-size:1.4rem">›</span></button>' +
      '<div class="card stack"><b>Demo controls</b><span class="muted small">Today in the demo: ' + dateFmt.format(now()) + ". You get one pass a day, so move to the next day to order again.</span>" +

      '<button class="btn line" data-a="sign-out">Sign out</button>' +
      '<p class="demo-note"><button class="linkbtn" data-a="terms">Terms</button> · Questions about an order go to the shop that made it.</p>';
  }

  // ---- Shop app
  function counterPicker() {
    var st = shopStatus(state.counterShop);
    return '<p class="muted small" style="padding:0 4px;font-weight:800;text-transform:uppercase;letter-spacing:.06em">' + esc(shopById(state.counterShop).name) + "</p>" +
      (st === "pending" ? '<div class="alert ok" role="status" style="color:var(--espresso);border-color:var(--honey)">Your shop is waiting for approval. Members can\'t see it yet. We\'ll email you as soon as you\'re live.</div>' : "") +
      ((state.removed || {})[state.counterShop] ? removedCard() : st === "paused" ? '<div class="alert" role="alert">Your shop is paused by Sippy Brew and hidden from members. Contact support.</div>' : "");
  }
  function removedCard() {
    var appeal = (state.appeals || {})[state.counterShop];
    return '<div class="card stack removed-card" role="alert"><b style="color:var(--danger);font-size:1.15rem">Your shop was removed for selling food</b>' +

      "</div>";
  }

  /** "Start at" glows and breathes as the start time gets close; "Start now" pulses stronger. */
  function startAt(o) {
    var u = o.status === "received" ? S.prepUrgency(o.pickupAt, now()) : "later";
    var label = u === "now" ? "Start now" : u === "late" ? "Due now: start it" : "Start at " + timeFmt.format(S.startMakingAt(o.pickupAt));
    return '<span class="start-at ' + u + '"' + (u === "later" ? "" : ' role="status"') + ">" + (u === "later" ? "" : '<span aria-hidden="true">●</span>') + label + "</span>";
  }

  function shopOrdersTab() {
    var list = state.orders.filter(function (o) { return o.shopId === state.counterShop && OPEN.indexOf(o.status) >= 0; });
    var cards = list.map(function (o) {
      var next = S.nextStatus(o.status);
      var canNoShow = S.canFlagNoShow({ status: o.status, pickupAt: o.pickupAt }, now()).ok;
      return '<div class="card stack' + (o.allergy ? " allergy-card" : "") + '"' + (o.status === "ready" && !o.allergy ? ' style="box-shadow:0 0 0 3px var(--sky)"' : "") + ">" +
        (o.allergy ? '<div class="allergy-notice" role="alert"><b>⚠️ ALLERGY NOTICE</b><span>' + esc(o.allergy) + "</span></div>" : "") +
        '<div class="row between"><h2 style="font-size:1.6rem">' + firstName() + '</h2><span class="badge' + (o.status === "ready" ? " sky" : "") + '">' + LABEL[o.status] + "</span></div>" +
        '<span class="muted"><b>Pickup ' + timeFmt.format(new Date(o.pickupAt)) + "</b></span>" + startAt(o) +

        '<span class="muted small">' + money2(o.totalCents) + " · Daily Pass" + (o.overageCents ? " + " + money2(o.overageCents) + " overage (paid in app, 100% yours)" : "") + "</span>" +
        (next && next !== "picked_up" ? '<button class="btn" data-a="advance" data-id="' + o.id + '">Mark ' + LABEL[next].toLowerCase() + "</button>" : "") +
        (o.status === "ready" ? '<button class="btn" data-a="shop-tab" data-id="scan">Scan to hand off</button>' : "") +
        (canNoShow ? (state.confirmNoShow === o.id

          : '<button class="btn line" data-a="no-show" data-id="' + o.id + '">Not picked up</button>') : "") +

      (accepting ? "Members can order from you now." : "Members can see your shop but can't order.") + '</span></span>' +
      '<input id="accepting" type="checkbox" data-a="accepting" ' + (accepting ? "checked" : "") + ' style="width:26px;height:26px;accent-color:var(--success)"></label>' +
      '<h1 style="font-size:2rem;padding:0 4px">Live orders</h1>' +
      '<div class="tip-card"><b>Make Sippy Brew orders close to pickup.</b> Each order shows when to start (' + S.RULES.prepLeadMinutes + " minutes before pickup), so drinks are fresh and fewer are wasted if someone doesn't show.</div>" +
      (list.length ? '<button class="btn ghost" data-a="skip-ahead">Demo: jump ahead 45 minutes</button>' : "") +
      (cards ? '<div class="stack">' + cards + "</div>" : '<div class="card muted">No orders right now. New pickup orders show up here. (Demo: sign out, log in as a member, and order from this shop.)</div>');
  }

  function shopScanTab() {
    var waiting = state.orders.filter(function (o) { return o.shopId === state.counterShop && OPEN.indexOf(o.status) >= 0; });
    var hint = waiting.map(function (o) {
      var t = latestTicket(o.id);
      return '<button class="btn line" data-a="scan-phone" data-id="' + o.id + '">Scan ' + firstName() + "'s phone" + (t ? " (code " + t.shortCode + ")" : "") + "</button>";

        '<div class="lines small" style="margin-top:8px;color:var(--espresso);font-weight:400">' +
        '<div class="row"><span>Pass-covered value</span><span class="num">' + money2(r.pay.passCoveredCents) + "</span></div>" +
        '<div class="row"><span>12% commission</span><span class="num">−' + money2(r.pay.commissionCents) + "</span></div>" +

        '<div class="row total"><span>Your payout for this order</span><span class="num" style="font-size:1rem">' + money2(r.pay.shopCents) + "</span></div></div></div>"
      : '<div class="alert" role="alert">' + esc(r.message) + "</div>") : "";
    return counterPicker() + '<h1 style="font-size:2rem;padding:0 4px">Scan</h1>' +
      '<div class="card stack"><span class="muted small">On a real phone this is the camera. In the demo, tap to scan the member\'s screen, or type their code.</span>' +

  // ---------------------------------------------------------------- Render
  var root, qrTimer = null;
  function render() {
    var html = "";
    if (state.screen === "landing") html = landing();
    else if (state.screen === "signup") html = signup();
    else if (state.screen === "plans") html = plans();
    else if (state.screen === "shop-login") html = shopLogin();
    else if (state.screen === "shop-signup") html = shopSignup();
    else if (state.screen === "admin-login") html = adminLogin();
    else if (state.screen === "quiz") html = quiz();
    else if (state.screen === "result") html = quizResultScreen();
    else if (state.screen === "near") html = nearScreen();
    else if (state.screen === "terms") html = termsScreen();
    else if (state.screen === "faq") html = faqScreen();
    else if (state.screen === "contact") html = contactScreen();
    else {
      html = appTop();
      if (state.session === "admin") {
        html += state.adminTab === "shops" ? adminShops() : state.adminTab === "members" ? adminMembers() : adminOverview();
      } else if (state.session === "member") {
        if (state.detail && state.detail.type === "shop") html += shopDetail(state.detail.id) + (state.customize ? customizeSheet(shopById(state.customizeShop || state.detail.id)) : "");
        else if (state.detail && state.detail.type === "cart") html += cartScreen() + (state.customize ? customizeSheet(shopById(state.customizeShop || state.cartShop)) : "");
        else if (state.detail && state.detail.type === "qr") html += qrDetail(state.detail.id);
        else html += state.tab === "orders" ? ordersTab() : state.tab === "account" ? accountTab() : shopsTab();
      } else {
        html += state.shopTab === "scan" ? shopScanTab() : state.shopTab === "menu" ? shopMenuTab() : state.shopTab === "dashboard" ? shopDashTab() : state.shopTab === "faq" ? faqList(S.MERCHANT_FAQ, S.MERCHANT_FAQ_FOOTNOTE, "Shop FAQ") + '<button class="btn line" data-a="contact">Contact Sippy Brew</button>' : shopOrdersTab();
      }
      html += tabs();
    }

  function startQr() {

    var id = state.detail.id, o = orderById(id);
    if (!o || OPEN.indexOf(o.status) < 0) return;
    var t = liveTicket(id); drawQr(t);
    var tick = function () {
      var cur = latestTicket(id);
      var left = S.qrSecondsRemaining(new Date(cur.expiresAt), new Date());

  // ---------------------------------------------------------------- Actions
  function addToCart(menuItemId, optionIds, quantity, shopId) {
    if (shopId) state.cartShop = shopId;
    var key = menuItemId + "|" + optionIds.slice().sort().join(",");
    var existing = state.cart.filter(function (l) { return l.key === key; })[0];
    if (existing) existing.quantity = Math.min(S.MAX_QUANTITY_PER_LINE, existing.quantity + quantity);
    else state.cart.push({ key: key, menuItemId: menuItemId, optionIds: optionIds, quantity: quantity });
    state.confirmedOverage = null; state.error = null;
  }

  function placeOrder(shopId) {
    var s = shopById(shopId), t = tier(), n = now();
    var lines = state.cart.map(function (l) { return { menuItemId: l.menuItemId, quantity: l.quantity, optionIds: l.optionIds }; });
    var slots = S.pickupSlots(n, ALL_DAY, TZ);
    var pickupAt = slots[Math.min(state.pickupIdx, slots.length - 1)];
    var menu = menuForOrder(s);
    var r = S.validateOrder(lines, {
      shop: { id: s.id, status: isPaused(s.id) || shopStatus(s.id) !== "active" ? "paused" : "active", hours: ALL_DAY },
      subscription: { status: "active", currentPeriodEnd: new Date(n.getTime() + 30 * 864e5).toISOString() },
      menu: menu, passesLeft: totalPassesLeft(), passDaysUsed: state.passDaysUsed, maxPassValueCents: t.maxPassValueCents,
      confirmedOverageCents: state.confirmedOverage, pickupAt: pickupAt, now: n, timeZone: TZ,
      bonusPassesLeft: bonusLeft(), useBonusForOverage: !!state.useBonus,
    });
    if (!r.ok) { state.error = r.message; return render(); }
    var sizes = {}; s.menu.forEach(function (m) { sizes[m.id] = m.size; });
    var id = "o" + Date.now().toString(36);
    var notes = S.cleanOrderNote({ note: state.orderNote, allergy: state.orderAllergy });
    if (!notes.ok) { state.error = notes.message; return render(); }
    state.orders.unshift({ id: id, shopId: s.id, status: "received", note: notes.note, allergy: notes.allergy, totalCents: r.totalCents, passCoveredCents: r.passCoveredCents, overageCents: r.overageCents,
      passDay: r.passDay, pickupAt: pickupAt.toISOString(), createdAt: n.toISOString(), redeemedAt: null,
      items: r.lines.map(function (l) { return { name: l.name, size: sizes[l.menuItemId], quantity: l.quantity, options: l.options }; }) });
    // This month's passes first (they expire sooner), then the bonus pass that expires soonest.
    var bonusKey = null;
    if (S.passSourceForOrder(state.passesLeft, bonusLeft()) === "bonus") { var g = S.nextBonusToUse(state.bonus, n); g.used += 1; bonusKey = g.key; }
    else state.passesLeft -= 1;
    state.orders[0].bonusKey = bonusKey;
    if (r.bonusCoveredCents > 0) { var g2 = S.nextBonusToUse(state.bonus, n); g2.used += 1; state.orders[0].overageBonusKey = g2.key; state.orders[0].bonusCoveredCents = r.bonusCoveredCents; }
    state.useBonus = false; state.orderNote = ""; state.orderAllergy = "";
    state.passDaysUsed.push(r.passDay);
    state.cart = []; state.cartShop = null; state.confirmedOverage = null; state.error = null; state.counterShop = s.id;
    state.detail = { type: "qr", id: id };
    issueTicket(id);
    render(); window.scrollTo(0, 0);
    toast(bonusKey ? "Order placed with a bonus pass." : "Order placed. Your pass is used for today.");
  }

  function redeem(input) {
    var nowMs = Date.now(), t = null;
    if (input.orderId) t = latestTicket(input.orderId);
    else {
      var code = S.normalizeShortCode(input.code || "");
      if (!code) { state.scan = { ok: false, message: "Codes are 6 letters and numbers." }; return render(); }
      state.tickets.forEach(function (x) { if (x.shortCode === code && (!t || x.issuedAt > t.issuedAt)) t = x; });
    }
    if (!t) { state.scan = { ok: false, message: "That code wasn't found." }; return render(); }
    var o = orderById(t.orderId);
    var check = S.checkRedeemable({ expiresAt: new Date(t.expiresAt), redeemedAt: t.redeemedAt ? new Date(t.redeemedAt) : null, orderShopId: o.shopId, orderStatus: o.status }, state.counterShop, new Date(nowMs));

      state.scan = { ok: false, message: check.message };

    }

    awardVisit();

    render();

  function boot() {
